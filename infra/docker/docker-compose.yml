services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: rb-firestore-emulator
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8085
    ports:
      - '8085:8085'
    environment:
      - FIRESTORE_PROJECT_ID=runbook-local-dev

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: rb-pubsub-emulator
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8086
    ports:
      - '8086:8086'
    environment:
      - PUBSUB_PROJECT_ID=runbook-local-dev

  rb-control:
    build:
      context: ../..
      dockerfile: apps/control/Dockerfile
    container_name: rb-control
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8085
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8086
      - GCP_PROJECT=runbook-local-dev
      - MODEL_ADAPTER=fake
      - DEPLOYMENT_MODE=local
      - LOCAL_ORCHESTRATION=true
      - BROKER_URL=http://rb-broker:8081
      - LOCAL_AUTHORITY=true
      - LOCAL_AUTHORITY_ID=local-incident-commander
      - LOCAL_OPERATOR_PRINCIPALS=local-operator
      - FLEET_BRIDGE_TOKEN=${FLEET_BRIDGE_TOKEN:-royal-duke-local-demo-bridge-v1}
    depends_on:
      - firestore-emulator
      - pubsub-emulator

  rb-broker:
    build:
      context: ../..
      dockerfile: apps/broker/Dockerfile
    container_name: rb-broker
    ports:
      - '8081:8081'
    environment:
      - PORT=8081
      - GCP_PROJECT=runbook-local-dev
      - LOCAL_TRANSPORT=true
      - DEPLOYMENT_MODE=local
      - LOCAL_MOCK_MUTATION_GATE=true
      - ALLOWED_CAPABILITY_ORIGINS=http://royal-duke-worker:8082
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8085
    depends_on:
      - royal-duke-worker
      - firestore-emulator

  royal-duke-worker:
    build:
      context: ../..
      dockerfile: apps/royal-duke-worker/Dockerfile
    container_name: royal-duke-worker
    ports:
      - '8082:8082'
    environment:
      - PORT=8082
      - ROYAL_DUKE_CONTROLLER_URL=${ROYAL_DUKE_CONTROLLER_URL:-}

  rb-console:
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
    container_name: rb-console
    ports:
      - '${CONSOLE_PORT:-4173}:8080'
    depends_on:
      - rb-control
